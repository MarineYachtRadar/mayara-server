name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - run: cargo fmt --check

  gui:
    name: GUI modules
    runs-on: ubuntu-latest
    # This job runs a script from the branch under review, so it gets no more
    # than it needs and no credentials left behind for that script to find.
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    # The GUI is embedded into the binary at compile time, so a module a
    # browser cannot load still compiles, ships, and breaks only on the boat.
    - run: node dev/check-gui-modules.mjs

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
        targets: x86_64-pc-windows-gnu
    - uses: swatinem/rust-cache@v2
      with:
        key: clippy
    - name: cargo clippy (default features)
      run: cargo clippy --no-deps --all-targets -- -D warnings
    - name: cargo clippy (--features pcap-replay)
      run: cargo clippy --no-deps --all-targets --features pcap-replay -- -D warnings
    # ring's build script compiles C for the target even when cargo only
    # checks, so the mingw cross compiler is needed despite nothing being
    # linked.
    - name: Install the mingw-w64 cross compiler
      run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
    # The Windows modules are behind cfg(target_os), so a host-target clippy
    # never sees them. Clippy only checks, so this needs the target's std but
    # no Windows linker.
    - name: cargo clippy (Windows target)
      run: cargo clippy --no-deps --all-targets --target x86_64-pc-windows-gnu -- -D warnings

  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl, x86_64-pc-windows-gnu]

    steps:

    - name: Checkout
      uses: actions/checkout@v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - uses: swatinem/rust-cache@v2
      with:
        key: ${{ matrix.target }}

    - name: Install Cross
      run: cargo install cross

    - name: Build
      run: cross build --release --target ${{ matrix.target }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: mayara-server for ${{ matrix.target }}
        path: target/${{ matrix.target }}/release/mayara-server*

  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
    - uses: swatinem/rust-cache@v2
    - name: Run tests
      run: cargo test --features pcap-replay --release
    - name: Build
      run: cargo build --release
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: Mayara Windows x86_64
        path: target/release/mayara-server.exe

  macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - uses: swatinem/rust-cache@v2
    - uses: taiki-e/install-action@v2.86.8
      with:
        tool: nextest
    - name: Run tests
      run: cargo nextest run --features pcap-replay
    - name: Build
      run: cargo build --release
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: Mayara macOS
        path: target/release/mayara-server
