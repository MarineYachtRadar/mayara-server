name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - run: cargo fmt --check

  gui:
    name: GUI modules
    runs-on: ubuntu-latest
    # This job runs a script from the branch under review, so it gets no more
    # than it needs and no credentials left behind for that script to find.
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
    # The GUI is embedded into the binary at compile time, so a module a
    # browser cannot load still compiles, ships, and breaks only on the boat.
    - run: node dev/check-gui-modules.mjs
    - run: node --test dev/*.test.mjs

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: swatinem/rust-cache@v2
      with:
        key: clippy
    - name: cargo clippy (default features)
      run: cargo clippy --no-deps --all-targets -- -D warnings
    - name: cargo clippy (--features pcap-replay)
      run: cargo clippy --no-deps --all-targets --features pcap-replay -- -D warnings

  # The Windows modules are behind cfg(target_os), so the Linux clippy never
  # sees them. ring, libz-sys and network-interface compile C for the target
  # even when cargo only checks; a Windows runner has that compiler, where
  # Linux would need the mingw cross compiler from apt.
  clippy-windows:
    name: cargo clippy (Windows)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: swatinem/rust-cache@v2
      with:
        key: clippy
    - name: cargo clippy
      run: cargo clippy --no-deps --all-targets -- -D warnings

  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl, x86_64-pc-windows-gnu]

    steps:

    - name: Checkout
      uses: actions/checkout@v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - uses: swatinem/rust-cache@v2
      with:
        key: ${{ matrix.target }}

    - name: Install Cross
      run: cargo install cross

    - name: Build
      run: cross build --release --target ${{ matrix.target }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: mayara-server for ${{ matrix.target }}
        path: target/${{ matrix.target }}/release/mayara-server*

  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
    - uses: swatinem/rust-cache@v2
    - uses: taiki-e/install-action@v2.87.30
      with:
        tool: nextest
    - name: Run tests
      run: cargo nextest run --features pcap-replay
    - name: Build
      run: cargo build --release
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: Mayara Windows x86_64
        path: target/release/mayara-server.exe

  linux:
    name: Test Linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: swatinem/rust-cache@v2
    - uses: taiki-e/install-action@v2.87.30
      with:
        tool: nextest
    # The ARPA regression tests replay recordings too big for this
    # repository; they live with the other large recordings, and this fetches
    # only their files. The commit is pinned to the one the checked-in
    # baselines were scored on, so a change there cannot move the scores here.
    - name: Fetch the ARPA regression recordings
      run: |
        git init -q ../radar-recordings
        cd ../radar-recordings
        git remote add origin https://github.com/keesverruijt/radar-recordings.git
        git sparse-checkout set --no-cone 'navico/halo/halo20plus-722*' 'furuno/moin/drs4dnxt-anchor-approaching*'
        git fetch -q --depth 1 --filter=blob:none origin "$RECORDINGS_REF"
        git checkout -q FETCH_HEAD
      env:
        GIT_LFS_SKIP_SMUDGE: "1"
        RECORDINGS_REF: 3c13e26952a41061280fcd7473c761d07ef0b3a9
    - name: Run tests
      run: cargo nextest run --features pcap-replay
      env:
        MAYARA_REQUIRE_RECORDINGS: "1"

  macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - uses: swatinem/rust-cache@v2
    - uses: taiki-e/install-action@v2.87.30
      with:
        tool: nextest
    - name: Run tests
      run: cargo nextest run --features pcap-replay
    - name: Build
      run: cargo build --release
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: Mayara macOS
        path: target/release/mayara-server
