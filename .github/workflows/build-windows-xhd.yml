name: Build Windows (garmin-xhd-output)

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - uses: swatinem/rust-cache@v2

    - name: Build
      run: cargo build --release --features garmin-xhd-output

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: mayara-server-windows-xhd
        path: target/release/mayara-server.exe
        retention-days: 30
