name: Release

# Builds a release's binaries, attaches them to its GitHub Release and
# publishes its Docker image. release-please.yml creates the tag and the
# release, with its notes, when its release PR is merged, and then dispatches
# this workflow on the tag: a tag pushed with GITHUB_TOKEN starts no workflow
# by itself. Dispatching it by hand on a tag (`gh workflow run release.yml
# --ref vX.Y.Z`) builds that release again and replaces its binaries.
on:
  workflow_dispatch:

# One build of a tag at a time, so a run started by hand cannot upload the
# binaries of a release that another run is uploading. Never cancelled, since
# a run may be uploading.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # The binaries and image are named after github.ref_name, and the binaries
  # go to that tag's GitHub Release, so anything but a released version tag
  # is refused before the builds start.
  guard:
    name: Check the ref is a released tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Refuse anything but a version tag
      if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
      run: |
        echo "::error::Dispatch release.yml on a version tag (--ref vX.Y.Z), not $GITHUB_REF."
        exit 1

    - name: Refuse a tag without a GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null; then
          echo "::error::$GITHUB_REF_NAME has no GitHub Release to attach the binaries to; release-please creates it when its release PR is merged."
          exit 1
        fi

  build-linux:
    name: Build ${{ matrix.target }}
    needs: guard
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            channel: stable
          - target: aarch64-unknown-linux-musl
            channel: stable
          # mipsel (e.g. OpenWrt/mt7621 devices) is a tier-3 target: rustup
          # ships no prebuilt std for it, so std has to be built from source
          # with `-Z build-std`, which requires nightly. See Cross.toml for
          # the custom cross image this needs.
          - target: mipsel-unknown-linux-musl
            channel: nightly

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install Rust (stable)
      if: matrix.channel == 'stable'
      uses: dtolnay/rust-toolchain@stable

    - name: Install Rust (nightly)
      if: matrix.channel == 'nightly'
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: rust-src

    - uses: swatinem/rust-cache@v2
      with:
        key: ${{ matrix.target }}

    - name: Install Cross
      run: cargo install cross

    - name: Build
      run: |
        if [ "${{ matrix.channel }}" = "nightly" ]; then
          cross build -Z build-std=std,panic_abort --release --features official-build --target ${{ matrix.target }}
        else
          cross build --release --features official-build --target ${{ matrix.target }}
        fi

    - name: Package
      run: |
        cd target/${{ matrix.target }}/release
        tar -czvf mayara-server-${{ github.ref_name }}-${{ matrix.target }}.tar.gz mayara-server
        mv mayara-server-${{ github.ref_name }}-${{ matrix.target }}.tar.gz ../../../

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: mayara-server-${{ matrix.target }}
        path: mayara-server-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

  build-macos:
    name: Build macOS Universal
    needs: guard
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-apple-darwin,x86_64-apple-darwin

    - uses: swatinem/rust-cache@v2

    - name: Build ARM64
      run: cargo build --release --features official-build --target aarch64-apple-darwin

    - name: Build x86_64
      run: cargo build --release --features official-build --target x86_64-apple-darwin

    - name: Create universal binary
      run: |
        lipo -create \
          target/aarch64-apple-darwin/release/mayara-server \
          target/x86_64-apple-darwin/release/mayara-server \
          -output mayara-server
        file mayara-server

    - name: Package
      run: tar -czvf mayara-server-${{ github.ref_name }}-universal-apple-darwin.tar.gz mayara-server

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: mayara-server-macos
        path: mayara-server-${{ github.ref_name }}-universal-apple-darwin.tar.gz

  build-windows:
    name: Build Windows
    needs: guard
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - uses: swatinem/rust-cache@v2

    - name: Build
      run: cargo build --release --features official-build

    - name: Package
      run: Compress-Archive -Path target/release/mayara-server.exe -DestinationPath mayara-server-${{ github.ref_name }}-x86_64-pc-windows.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: mayara-server-windows
        path: mayara-server-${{ github.ref_name }}-x86_64-pc-windows.zip

  release:
    name: Attach binaries
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      # release-please has created the release, with its notes; this only
      # attaches the binaries to it.
      contents: write

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts

    - name: List artifacts
      run: find artifacts -type f

    # --clobber so a release built again replaces its binaries.
    - name: Attach to the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
          artifacts/mayara-server-x86_64-unknown-linux-musl/*.tar.gz \
          artifacts/mayara-server-aarch64-unknown-linux-musl/*.tar.gz \
          artifacts/mayara-server-mipsel-unknown-linux-musl/*.tar.gz \
          artifacts/mayara-server-macos/*.tar.gz \
          artifacts/mayara-server-windows/*.zip

  docker:
    name: Publish Docker Image
    needs: release
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
