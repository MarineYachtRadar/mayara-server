# Releases, without anyone editing version numbers by hand.
#
# On every push to main, release-please keeps one pull request open,
# "chore(release): <version>", that bumps the version in Cargo.toml and
# Cargo.lock and adds the release's entry to CHANGELOG.md. The version and
# the entry follow the Conventional Commit subjects merged since the last
# release (PR titles, since PRs are squash-merged): a `!` or a BREAKING
# CHANGE footer is a major release, feat a minor one, fix, refactor, perf
# and docs a patch. Only those types, the ones release-please-config.json
# shows in the changelog, and breaking changes start a release; a merge of
# only ci, test or chore changes leaves things as they are. Merging that
# pull request IS the release: the next run tags it, creates the GitHub
# Release with the same entry as its notes, and dispatches release.yml on
# the tag, which builds the binaries, attaches them to the release and
# publishes the Docker image. Nothing is released until a maintainer merges
# the release PR.
name: release-please

on:
  push:
    branches: [main]
  # Rewrites the open release PR against the current configuration, or tags
  # a merged release PR a failed run left untagged.
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    # One release-please at a time: two runs, a push and a manual run say,
    # could both find the merged release PR untagged and both try to create
    # its release. Never cancelled in progress, since a run may be creating
    # the tag. A queued run that a newer one replaces loses nothing, because
    # every run tags whatever merged release PR is still untagged and builds
    # the open one from the whole range.
    concurrency:
      group: release-please
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The tag release-please just pushed does not start release.yml by itself:
  # an event raised with GITHUB_TOKEN starts no workflow, with
  # workflow_dispatch as the exception. So release.yml is dispatched on the
  # tag, which it builds and names its assets after (github.ref_name) -- as a
  # reusable workflow called from here it would see main instead. Its own job,
  # so that the right to start workflows is held by nothing but this one
  # command.
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
