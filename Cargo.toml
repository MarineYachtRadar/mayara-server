[package]
name = "mayara"
version = "3.10.0"
edition = "2024"
rust-version = "1.90"
description = "Marine radar server with REST API and WebSocket support"
license = "Apache-2.0"
readme = "README.md"
keywords = ["radar", "marine", "server", "websocket", "rest-api"]
categories = ["network-programming", "web-programming::http-server"]

[package.metadata]
api-version = "3.4.0"

[lib]
name = "mayara"
path = "src/lib/mod.rs"

[features]
navico = []
furuno = []
garmin = []
koden = []
raymarine = []
emulator = []
pcap-replay = []
# Emulate a Garmin GMR xHD radar so a Garmin chartplotter can display any
# radar mayara has found. Built on the `garmin` brand's protocol definitions.
garmin-xhd-output = ["garmin"]
# default = ["navico", "furuno", "raymarine"]
default = ["navico", "furuno", "garmin", "koden", "raymarine", "emulator"]

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
atomic_float = "1.1.0"
axum = { version = "0.8.9", features = ["http2", "json", "macros", "tokio", "tower-log", "tracing", "ws"] }
axum-core = "0.5.6"
axum-embed = "0.1.0"
base64 = "0.23.0"
bincode = { version = "2.0.1", features = ["serde"] }
bitflags = "2.11.1"
bytes = "1"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
clap-verbosity-flag = "3.0.4"
crossbeam = "0.8.4"
directories = "6.0.0"
enum-primitive-derive = "0.3.0"
env_logger = { version = "0.11", default-features = false, features = ["humantime", "auto-color"] }
# `zlib-ng-compat` makes libz-sys build zlib-ng instead of plain zlib while
# keeping the zlib API tungstenite expects. zlib-ng has SIMD-accelerated
# `longest_match` / `crc32` on aarch64 (NEON) and ~1.5-2× faster compression
# at the same level. Feature unification routes WebSocket permessage-deflate
# through this backend as well.
flate2 = { version = "1", features = ["zlib-ng-compat"] }
futures = "0.3.32"
futures-util = "0.3.32"
headers = "0.4.1"
http = "1.4.1"
hyper = "1.10.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"
hyper-util = "0.1.20"
libc = "0.2.186"
log = "0.4.30"
mdns-sd = "0"
miette = { version = "7.6.0", features = ["fancy"] }
nalgebra = { version = "0.35.0", features = ["std", "macros", "convert-mint", "rand"] }
ndarray = "0.17.2"
network-interface = "2.0.5"
nix = { version = "0.31.3", features = ["net", "socket"] }
nmea-parser = { git = "https://github.com/keesverruijt/nmea-parser", "branch" = "position_precision" }
num-derive = "0.5.1"
num-traits = "0.2.19"
once_cell = "1.21.4"
protobuf = "3.7.2"
rust-embed = { version = "8.11.0", features = ["axum","interpolate-folder-path"] }
serde = { version = "1.0.228", features = ["derive", "serde_derive"] }
serde_json = "1.0.150"
serde_repr = "0.1.20"
serde_with = { version = "3.20.0", features = ["macros"] }
sha1 = "0.11.0"
# `features = ["all"]` is socket2's single feature flag — it gates the
# platform-conditional APIs (e.g. TCP_KEEPIDLE/TCP_KEEPINTVL/TCP_KEEPCNT
# setters) that not every target supports. We need it for
# `TcpKeepalive::with_interval` / `with_retries` / `SockRef::set_tcp_keepalive`
# on the Furuno control socket.
socket2 = { version = "0.6.4", features = ["all"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["formatting"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-graceful-shutdown = "0.20.0"
tokio-util = "0.7.18"
tower = "0.5.3"
tower-http = { version = "0.7", features = ["set-header", "trace"] }
utoipa = { version = "5", features = ["macros", "axum_extras", "chrono", "time", "url", "repr" ] }
serde_string_enum = "0.2.1"
unicase = "2.9.0"
wildmatch = "2.6.1"
utoipa-swagger-ui = { version = "9.0.2", features = ["url", "axum"] }
tokio-tungstenite = { version = "0.26.2", features = [ "handshake", "deflate", "rustls-tls-native-roots" ] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }

[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/keesverruijt/tokio-tungstenite", tag = "v0.26.2-signalapp-v0.27.0"}

[target.'cfg(target_os = "macos")'.dependencies]
system-configuration = "0.8.0"

[target.'cfg(target_os = "linux")'.dependencies]
netlink-sys = { version = "0.9.0", features = ["tokio", "tokio_socket"] }
rtnetlink = "0.23.0"

[target.'cfg(target_os = "windows")'.dependencies]
w32-error = "1.0.0"
windows = { version = "0.62.2", features = ["Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_WiFi", "Win32_Networking_WinSock", "Win32_System", "Win32_System_Threading", "Win32_Security", "Win32_System_Diagnostics", "Win32_System_Diagnostics_Debug", "Win32_System_IO", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_SystemServices" ] }

[build-dependencies]
protobuf-codegen = "3.7.2"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "blocking"] }
rust-embed = { version = "8.11.0", features = ["axum","interpolate-folder-path"] }

[dev-dependencies]
# Integration tests hit http://localhost, so no TLS backend is needed. Disabling
# default features keeps native-tls/openssl-sys out of the tree entirely.
reqwest = { version = "0.12.28", default-features = false, features = ["json"] }
tokio-test = "0.4"
tempfile = "3"

[[example]]
name = "generate-fixtures"
required-features = ["pcap-replay"]

