language: en-US

reviews:
  profile: assertive
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    # Skip mechanical PRs that don't benefit from review.
    # `chore(release):` PRs are version-bump-only (Cargo.toml + Cargo.lock);
    # the substantive change was already reviewed on its own PR. CHANGELOG
    # auto-update PRs are generated by git-cliff in CI. Dependency-bump PRs
    # come from automation that has its own contract with the registry.
    # WIP and explicit skip markers are author opt-outs.
    ignore_title_keywords:
      - 'chore(release):'
      - 'docs(changelog):'
      - 'chore(deps):'
      - 'chore(deps-dev):'
      - 'build(deps):'
      - '[skip review]'
      - 'WIP'
    ignore_usernames:
      - 'dependabot[bot]'
      - 'renovate[bot]'
      - 'release-please[bot]'
      - 'github-actions[bot]'

  # `target/` is the cargo build output; `web/gui/proto/RadarMessage.proto`
  # mirrors `src/lib/protos/RadarMessage.proto` (the source of truth) so the
  # JS client can load it without crossing the FS root. Lockfiles, captured
  # binary radar traffic, and reverse-engineering dumps are all not
  # reviewable as code.
  path_filters:
    - '!target/**'
    - '!**/Cargo.lock'
    - '!**/*.lock'
    - '!testdata/pcap/**'
    - '!testdata/**/*.bin'
    - '!testdata/**/*.cap'
    - '!testdata/**/*.pcap'
    - '!**/*.min.js'
    - '!**/*.min.css'
    # CHANGELOG.md is rewritten on every push to main by
    # .github/workflows/changelog.yml running git-cliff. Any contributor
    # edit is either redundant (will be overwritten by the workflow's
    # own follow-up PR) or wrong. Hand-curated entries belong in
    # CHANGELOG.manual.md, which the workflow appends. Excluding the
    # generated file from review stops CR from repeatedly flagging
    # phantom CHANGELOG.md edits on PRs that don't actually touch it.
    - '!CHANGELOG.md'

  high_level_summary_instructions: |
    Write summaries in present tense. Describe what the code does, not
    what it did. Skip filler like "This PR" — go straight to the change.

  path_instructions:
    - path: '**/*'
      instructions: |
        ## Project at a glance
        Mayara Server is the reference Signal K radar API server. Rust
        backend translates each marine radar brand's proprietary wire
        protocol into a uniform [Signal K Radar API]; binary spoke data
        flows over a WebSocket; a vanilla-JS reference GUI (web/gui/)
        consumes both via REST + protobuf-over-WebSocket. Brand support
        lives under `src/lib/brand/{navico,furuno,garmin,raymarine,
        koden,emulator}/`. The cross-brand abstractions live under
        `src/lib/radar/` (range, settings, ARPA tracker, guard zones).

        ## One logical change per PR
        Hard rule from AGENTS.md. Refactors, behavior changes, doc
        updates, and dependency bumps belong in separate PRs. If a
        single change would produce two distinct CHANGELOG lines, it
        should be two PRs. CI does a squash merge, so the PR title
        becomes the commit on main and feeds git-cliff for the
        auto-generated CHANGELOG.

        ## Conventional commit PR title
        The PR title must follow Angular conventional commit format:
        `<type>(<scope>): <subject>`. Accepted types: feat, fix, docs,
        style, refactor, test, chore, perf, ci. Subject: imperative
        mood ("add" not "added"), no trailing period, under 70
        characters. Scope is typically a brand (`furuno`, `navico`,
        …), a subsystem (`gui`, `arpa`, `signalk`, …), or `web`.

        ## CHANGELOG.md must not be edited manually
        CHANGELOG.md is auto-generated by git-cliff from conventional
        commits in `.github/workflows/changelog.yml` and `release.yml`.
        The only valid way to change the changelog is to change the
        commit / PR title. Flag any PR that modifies CHANGELOG.md
        directly.

        ## Version numbers are maintainer-managed
        Flag any non-`chore(release):` PR that changes the `version`
        field in `Cargo.toml`. Version bumps happen in their own
        release PR controlled by `release.sh`, never bundled with a
        feature or fix.

        ## Rebase, no merge commits
        AGENTS.md mandates rebase over merge when updating a branch
        with upstream. Flag any PR that introduces a merge commit
        rather than a linear history.

        ## No amending pushed commits
        AGENTS.md: never amend commits that have been pushed to
        GitHub. Force-pushing a published PR rewrites history shared
        with reviewers. If reviewers have already commented, push a
        follow-up commit instead.

        ## Echo comments
        Flag any comment that merely restates what the code already
        says. Examples:
        - `// Set the range` above a line that sets a range field
        - `// Loop through spokes` above a `for` loop over spokes
        - `// returns Err` above `return Err(...)`
        Replace with comments explaining *why*, not *what*. Or delete.

        ## Leftover crumbs from intermediate commits
        Flag references to things that existed in earlier commits of
        this PR but are no longer present: removed variables, renamed
        functions, deleted files, superseded approaches. Comments,
        docs, and code must describe the current state of the branch.

        ## Documentation drift risk
        Flag any .md file that contains detailed implementation steps,
        specific API call sequences, code snippets, or configuration
        values that are likely to fall out of sync. Documentation
        should describe architecture conceptually — not step-by-step
        instructions that duplicate or shadow the code.
        Intentional exceptions: radar protocol reverse-engineering
        notes under `docs/` and the `czone-re/` research repo are
        frozen-in-time observations, not live documentation; stable
        user/maintainer workflow docs (CONTRIBUTING.md, BUILDING.md,
        USAGE.md, AGENTS.md release-flow sections) are intentionally
        procedural.

        ## Unchecked items / speculative test plans
        If a PR description or .md file contains a checklist with
        unchecked items, flag it: either the work is incomplete or
        the checklist should be removed before merge. Flag any
        "Tested" section that lists manual tests as intentions rather
        than things that were actually run.

        ## AI attribution footers
        Flag any commit message, PR description, or code comment
        containing "Co-Authored-By: Claude", "Generated with Claude
        Code", "🤖 Generated with", or similar AI-attribution. These
        do not belong in the project history.

        ## Implementation status in product documentation
        Flag implementation-progress narratives in product /
        reference docs (e.g. "Step 3: implement X", "TODO: add Y",
        "currently implemented as Z"). This belongs in PR
        descriptions, not in documentation. Architecture decisions
        and design rationale are fine.

        ## Scope
        Focus on files changed since main. Think carefully about how
        changes interact with existing code, tests, and documentation —
        not just the diff in isolation.

    - path: 'src/**/*.rs'
      instructions: |
        ## Rust quality standards
        - Self-documenting code; comments explain *why*, not *what*.
        - Functions small and focused on a single responsibility.
        - Prefer composition over inheritance.
        - Handle errors explicitly at system boundaries; trust
          internal code and framework guarantees inside the boundary.
          Do not add error handling, fallbacks, or validation for
          scenarios that cannot happen.
        - No magic numbers; use named constants.

        ## Minimal visibility
        AGENTS.md: prefer `pub(crate)` or private over `pub` unless
        the item is part of the public library API. Flag any new
        `pub fn` / `pub struct` / `pub mod` that isn't exposed
        through `src/lib/mod.rs` — it should likely be `pub(crate)`.

        ## Tests are required
        All new code requires tests. Test behavior at the function /
        module boundary, not internal control flow. Unit tests for
        business logic; integration tests under `tests/` for boundary
        coverage.

        ## Cargo.toml and Cargo.lock
        Cargo.lock is tracked but auto-managed by `cargo update`.
        Flag manual edits to Cargo.lock that aren't accompanied by a
        Cargo.toml change.

    - path: 'src/lib/brand/**/*.rs'
      instructions: |
        ## Brand plugin contract
        Each brand module under `src/lib/brand/` implements the same
        contract: a locator that discovers radars on the network, a
        report/spoke receiver that decodes wire packets into a
        `CommonRadar`, and a command/control sender. All brand
        modules emit through the same `RadarSpoke` shape and
        `ControlId` enum — the rest of the codebase keys off those,
        not off brand-specific types.

        ## Spoke pipeline contract
        Brand spoke decoders call `common.add_spoke(range, angle,
        heading, data)` where:
        - `range` is the physical distance covered by the spoke
          buffer end to end (meters). Downstream distance math
          (ARPA, guard zones, GUI overlays) treats sample `i` as
          covering `i / data.len() * range` meters.
        - `angle` is the spoke index in `[0, SPOKES)`.
        - `data` is a fixed-size `Vec<u8>` of legend-mapped pixels.

        If a brand transmits oversampled data past the configured
        display range (Furuno's `sweep_len > scale`), report a
        widened `range` so the renderer scales the polar texture
        accordingly — do not silently truncate, the operator wants
        the corners filled. The configured display range stays on
        `ControlId::Range`; only the spoke metadata is widened.

        ## Doppler / Target Analyzer LUT discipline
        Several brands (Furuno NXT, Navico HALO) emit
        Doppler-encoded wire bytes. The legend-mapping LUT depends on
        the radar's Doppler state. Decoders MUST defer spoke emission
        until the Doppler state is confirmed (Furuno: `target_analyzer_known`,
        Navico: explicit Doppler-mode report). Otherwise strong
        stationary echoes get rendered with Doppler colors. Flag any
        change that emits spokes before the gating flag is set.

        ## Dual-range state isolation
        Dual-range radars (Furuno NXT, Navico HALO, Garmin Fantom)
        interleave two independent spoke streams. Delta-decoding
        state, prev-spoke buffers, and per-range Doppler state MUST
        be indexed by `range_idx` (0 = A, 1 = B). A single shared
        state corrupts the first delta-decoded spoke after every
        A↔B switch. Flag any new per-frame state added without an
        index dimension.

        ## Reverse-engineering provenance
        Code that came from disassembly of a vendor binary should
        carry a comment naming the source function and offset
        (e.g. `// from RadarDLLAccess RmGetEchoData()`, `// from
        decode_sweep_2 @ 10002740`). This is how the next maintainer
        finds where the magic constant came from. Flag any new
        magic constant or bit-twist that lacks provenance.

        ## pcap fixtures for new behavior
        Behavior changes that depend on the wire stream should add or
        reuse a pcap fixture under `testdata/pcap/`. Pure refactors
        don't need new fixtures. See `docs/capturing-traffic.md`.

    - path: 'src/lib/radar/**/*.rs'
      instructions: |
        ## Brand-agnostic abstractions only
        Code under `src/lib/radar/` is the cross-brand layer: range
        management, settings, ARPA target tracking, guard zones,
        trails. It must not reference any brand-specific type. If a
        change would require brand-specific behavior here, the right
        move is to extend the brand contract instead.

        ## ARPA tracker — IMM stability
        The ARPA tracker (`src/lib/radar/target/`) runs an
        Interacting Multiple Model filter (constant velocity,
        coordinated turn, maneuvering) and blends outputs by
        likelihood. Changes to filter coefficients, transition
        probabilities, or association gates can destabilise tracking
        across all radars. Flag tuning changes that don't include
        before/after metrics on a representative pcap.

        ## Range and unit handling
        `range.rs` is the single place that maps wire range indices
        to meters. New range tables go here. The GUI's
        `is_metric()` / `formatRangeValue()` belong in
        `web/gui/ppi.js` — keep them on their respective sides of
        the bridge.

    - path: 'src/bin/mayara-server/web/**/*.rs'
      instructions: |
        ## HTTP routes + WebSocket bridges only
        This crate is the Axum-based HTTP / WebSocket frontend.
        Routes here serve the Signal K v2 Radar API, the spoke
        WebSocket, and the embedded GUI. Business logic belongs in
        `src/lib/`, not here. Flag PRs that put protocol parsing,
        spoke decoding, or radar state machines in this crate.

        ## OpenAPI / Signal K API stability
        Changes that affect the Signal K Radar API surface
        (`/signalk/v2/api/vessels/self/radars/...`) need an
        `api-version` bump in `Cargo.toml` and the change documented
        in `docs/api/`. Flag API-shape changes that don't update
        both.

    - path: 'src/lib/protos/**'
      instructions: |
        ## Source of truth for protobuf
        `src/lib/protos/RadarMessage.proto` is THE proto definition.
        `web/gui/proto/RadarMessage.proto` is a copy that lets the
        browser load it without crossing the filesystem root. When
        the source changes, the copy MUST be kept in sync. Flag any
        PR that edits `src/lib/protos/RadarMessage.proto` without
        also updating `web/gui/proto/RadarMessage.proto`.

        Field-number changes are wire-breaking. Adding new fields is
        forward-compatible if existing field numbers are not reused;
        renumbering existing fields is not. Flag any renumbering.

    - path: 'web/gui/proto/**'
      instructions: |
        ## Generated mirror — do not edit
        Files under `web/gui/proto/` are copies of
        `src/lib/protos/*` so the browser can load them. Do not edit
        here. Flag any PR that changes a `.proto` file under
        `web/gui/proto/` without a matching change to
        `src/lib/protos/`. The right move is always to edit the
        source and re-sync the copy.

    - path: 'web/gui/**/*.js'
      instructions: |
        ## Vanilla JS, no build step
        The reference GUI is plain ES2020+ modules loaded directly
        by the browser; there is no bundler, no TypeScript, no
        Babel. Imports use relative paths with explicit `.js`
        extensions. Flag PRs that add a build step, a `package.json`,
        or `node_modules/` to the GUI without explicit operator-facing
        rationale.

        ## PPI is renderer-agnostic
        `web/gui/ppi.js` (the `PPI` class) is the renderer-agnostic
        overlay / spoke-processing layer. It calls into a renderer
        backend via a small interface
        (`render`, `clearDisplay`, `setRangeScale`, `setSpokes`,
        `resize`, `setLegend`). New rendering features should be
        added in a way that both backends can implement; if the
        backends diverge, the WebGL fallback path becomes a second-
        class citizen.

        ## Heading-mode coordinate transforms
        Coordinate math in the GUI must respect Head-Up vs North-Up:
        markers stored relative to bow render correctly in both
        modes by applying `headingRotation` (0 in HU, `trueHeading`
        in NU). Flag new overlay features that store geographic
        bearings directly instead of bow-relative — they'll drift
        on HU/NU switch.

    - path: 'web/gui/render_webgpu.js'
      instructions: |
        ## WebGPU/WebGL parity
        `render_webgpu.js` and `render_webgl.js` MUST implement the
        same polar-to-cartesian shader math, the same uniforms
        semantic, and the same range-scaling rule
        (`scaleX = (actual_range/range) * (2*beam_length/width)`
        with `r >= 1.0` clipping at the outer edge of the displayed
        area).

        If you change one renderer, change the other in the same
        PR. A drift means either WebGPU users or WebGL users
        (fallback path for browsers without WebGPU) see a different
        radar image. Flag PRs that edit one renderer without the
        matching change to the other, unless the description
        explicitly explains why the change is one-sided.

    - path: 'web/gui/render_webgl.js'
      instructions: |
        ## WebGPU/WebGL parity
        See `render_webgpu.js` instructions — they apply to this
        file too. The two renderers MUST implement the same math
        and uniforms semantic. If you change one, change the other.

    - path: '.github/workflows/**'
      instructions: |
        ## CHANGELOG generation
        `changelog.yml` runs git-cliff on push to main to regenerate
        CHANGELOG.md from the commit history. `release.yml` runs on
        `v*` tag push to cut a GitHub Release and trigger the
        cross-platform build / publish. Flag PRs that change either
        workflow's trigger or the git-cliff configuration
        (`cliff.toml`) without explicit rationale.

        ## Release artifacts via release.sh
        Version bumps go through `release.sh` (PR-based flow). The
        workflows assume the tag is created by that script after the
        `chore(release):` PR merges. Don't add manual tag-pushing
        side-doors.

    - path: 'Cargo.toml'
      instructions: |
        ## MSRV is a contract
        `rust-version` in `Cargo.toml` is the minimum supported Rust
        version. Bumping it can break user builds. Flag any bump
        without a stated reason (e.g. a dependency that requires the
        new toolchain).

        ## api-version vs version
        `api-version` is the Signal K Radar API surface version,
        independent of the Cargo crate version. Bump it when the
        public HTTP / WebSocket API changes (new endpoints, changed
        response shapes); not for internal refactors.

        ## Dependency footprint
        New direct dependencies need a reason in the PR description.
        Mayara ships as a single static binary; every added crate
        bloats the build, the binary, and the audit surface. Prefer
        std + existing deps. Flag new deps that lack a justification.

    - path: 'build.rs'
      instructions: |
        ## build.rs is for codegen, not magic
        Compile-time codegen (e.g. protobuf via prost-build) is
        expected here. Flag changes that:
        - read user environment variables to alter the build output
          (those break reproducibility)
        - download files from the network
        - emit `cargo:rerun-if-changed=...` directives that miss new
          inputs

    - path: 'tests/**'
      instructions: |
        ## Integration tests replay captured traffic
        Integration tests under `tests/` replay pcap files through
        the full radar pipeline (see `docs/internals/`). They MUST
        NOT contact the network. New behaviour that depends on the
        wire stream needs a pcap fixture under `testdata/pcap/`,
        captured per `docs/capturing-traffic.md`.

        ## Test naming
        Test names are searched verbatim by the regression-sentinel
        guards documented in the codebase (e.g. "alignment can
        overshoot", "starts the container even when start() is
        called with empty config" pattern in the plugin). Don't
        rename a test without confirming nothing greps for the old
        name.

    - path: 'docs/**'
      instructions: |
        ## Architecture-only, frozen-time research exception
        Documentation under `docs/` should describe architecture
        and how things work conceptually. The intentional exception
        is reverse-engineering notes (`docs/research/`, brand
        protocol notes, Ghidra dumps) — these are frozen-in-time
        observations and may name specific firmware versions,
        addresses, and bit layouts. Do not flag those as drift risk.

        Other docs (`BUILDING.md`, `CONTRIBUTING.md`, `USAGE.md`,
        brand setup guides) are operator-facing and intentionally
        procedural — don't flag step-by-step content there as drift
        either.

    - path: 'web/gui/**/*.css'
      instructions: |
        ## No build pipeline
        Plain CSS. No PostCSS, no Tailwind, no preprocessor. Class
        names follow the `myr_*` prefix to avoid collision with
        anything the Signal K admin UI might inject when the GUI is
        embedded.
